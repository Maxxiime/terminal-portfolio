<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Maxime Lemenand | Terminal Portfolio</title>
    <meta name="title" content="Maxime Lemenand | Terminal Portfolio" />
    <meta
      name="description"
      content="Infrastructure / DevOps terminal portfolio focused on automation, self-hosting and AI-assisted operations."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Maxime Lemenand | Terminal Portfolio" />
    <meta
      property="og:description"
      content="Infrastructure / DevOps terminal portfolio focused on automation, self-hosting and AI-assisted operations."
    />
    <meta
      property="og:image"
      content="/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="Maxime Lemenand | Terminal Portfolio" />
    <meta
      property="twitter:description"
      content="Infrastructure / DevOps terminal portfolio focused on automation, self-hosting and AI-assisted operations."
    />
    <meta
      property="twitter:image"
      content="/og-image.png"
    />

    <!-- Favicons and assets -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1d2a35" />
    <meta name="msapplication-TileColor" content="#1d2a35" />
    <meta name="theme-color" content="#1d2a35" />

    <!-- Optional Umami analytics. Vite replaces these values when configured. -->
    <script>
      (() => {
        const url = "%VITE_UMAMI_URL%";
        const websiteId = "%VITE_UMAMI_WEBSITE_ID%";
        if (!url || !websiteId || url.includes("%VITE_") || websiteId.includes("%VITE_")) return;
        const script = document.createElement("script");
        script.defer = true;
        script.src = url.endsWith("/script.js")
          ? url
          : `${url.replace(/\/$/, "")}/script.js`;
        script.dataset.websiteId = websiteId;
        document.head.appendChild(script);
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
